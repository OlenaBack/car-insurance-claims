[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "car-insurance-claims"
version = "0.1.0"
description = "Car-insurance claims AI system (stage 1: structured extraction with LLMs)"
requires-python = ">=3.11"
dependencies = ["ollama"]

[project.optional-dependencies]
dev = ["pytest", "python-lsp-server"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
